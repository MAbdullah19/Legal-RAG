# E9 (mid-tier variant) — grounded generation with a small LOCAL model.
# Same trust stack as e9_local_grounded, sized for a CPU-only dev box: small
# real embeddings + cross-encoder + a small Ollama model. Proves the full local
# generation path end-to-end (retrieve -> rerank -> local LLM -> deterministic
# verify). Production runs qwen2.5:7b-instruct + BGE-M3 on the RTX 3080.
#
# Needs: a running Ollama with the model pulled, e.g. `ollama pull qwen2.5:1.5b-instruct`.
name: e9_local_grounded_small
corpus: fixture
seed: 0

index:
  chunker: {name: fixed, max_tokens: 220}
  contextualizer: {name: none}
  embedder: {name: sentence_transformer, model: BAAI/bge-small-en-v1.5, normalize: true}
  vector_index: {name: memory}
  lexical_index: {name: bm25, k1: 1.5, b: 0.75}

retrieval:
  query_transformer: {name: none}
  dense_k: 20
  sparse_k: 20
  fusion: {name: rrf, k: 60}
  reranker: {name: bge_reranker, model: cross-encoder/ms-marco-MiniLM-L-6-v2}
  rerank_top_k: 8
  final_k: 8

generation:
  assembler: {name: concat, budget_tokens: 4000}
  generator:                        # <-- local grounded LLM over Ollama
    name: grounded
    backend: local
    model: qwen2.5:1.5b-instruct
    prompt: grounded_v1
    temperature: 0.0
    max_sources: 6
    timeout: 600                     # CPU generation is slow; be patient on the dev box
  verifier: {name: deterministic, require_quote_match: true}

eval:
  ks: [5, 10, 20]
  ndcg_k: 10
  bootstrap_samples: 1000
